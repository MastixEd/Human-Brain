/* Game 2: Signal Relay */
function relay(){const A=$('ga');A.innerHTML=`<div class="hud"><span id="s1"></span><span id="l1"></span></div><canvas id="gc" width="640" height="300"></canvas><p class="hint">Tap the screen or press Space when the pulse is inside the green synapse zone. Each hit makes the neuron fire faster. Firing too early or letting it pass drains your myelin.</p>`;
 const cv=$('gc'),g=cv.getContext('2d');let x=0,sp=150,sc=0,lv=3,over=false,msg='Ready…',fl=0,raf,last=performance.now();const Z0=500,Z1=590;
 function fire(){if(over){x=0;sp=150;sc=0;lv=3;over=false;msg='Go!';return}if(x>=Z0&&x<=Z1){sc++;sp+=16;msg='Fired! Neurotransmitters released';blip(900)}else{lv--;msg='Misfire! Myelin damaged';blip(170)}fl=.25;x=0;if(lv<=0){over=true;msg='Game over. Tap to restart'}}
 const kd=e=>{if(e.code=='Space'){e.preventDefault();fire()}};addEventListener('keydown',kd);cv.onpointerdown=fire;
 function lp(now){raf=requestAnimationFrame(lp);const dt=(now-last)/1000;last=now;if(!over){x+=sp*dt;if(x>Z1+20){lv--;msg='Missed the gap!';blip(170);x=0;if(lv<=0){over=true;msg='Game over. Tap to restart'}}}fl=Math.max(0,fl-dt);
  g.clearRect(0,0,640,300);g.fillStyle='rgba(42,230,140,.25)';g.fillRect(Z0,90,Z1-Z0,120);g.fillStyle='#fff7';g.font='13px system-ui';g.fillText('SYNAPSE',Z0+14,82);
  g.fillStyle='#ffe58a';g.fillRect(20,146,600,8);for(let i=0;i<7;i++){g.fillStyle='#ff9ec7';g.beginPath();g.roundRect(45+i*68,132,52,36,14);g.fill()}
  g.fillStyle='#5a9bff';g.beginPath();g.arc(20,150,28,0,7);g.fill();const gr=g.createRadialGradient(x+20,150,0,x+20,150,30);gr.addColorStop(0,'#fff');gr.addColorStop(1,'#7cf5ff00');g.fillStyle=gr;g.beginPath();g.arc(x+20,150,30,0,7);g.fill();
  if(fl>0){g.fillStyle=`rgba(255,255,255,${fl})`;g.fillRect(0,0,640,300)}g.fillStyle='#e8ecff';g.font='16px system-ui';g.fillText(msg,20,280);$('s1').textContent='Fired: '+sc;$('l1').textContent='Myelin: '+'♥'.repeat(Math.max(lv,0))}
 raf=requestAnimationFrame(lp);stop=()=>{cancelAnimationFrame(raf);removeEventListener('keydown',kd)}}

/* Game 3: Synapse Catcher */
function catchG(){const A=$('ga');A.innerHTML=`<div class="hud"><span id="s2"></span><span id="l2"></span></div><canvas id="gc" width="640" height="400"></canvas><p class="hint">Move your mouse or finger (or use ← →) to slide the receptor. Catch ONLY the target neurotransmitter shown at the top. Wrong catches cost a life.</p>`;
 const cv=$('gc'),g=cv.getContext('2d'),T3=[['Dopamine','#ffd23a'],['Serotonin','#4de4ff'],['Glutamate','#b07bff'],['GABA','#7dff7d'],['Cortisol','#ff3c3c'],['Oxytocin','#ff6bd6'],['Melatonin','#5b7cff'],['Endorphin','#ff9a3c']];
 let px=320,sc=0,lv=3,tg=0,tt=0,sp=0,items=[],over=false,raf,last=performance.now(),dir=0;
 cv.onpointermove=e=>{const r=cv.getBoundingClientRect();px=(e.clientX-r.left)/r.width*640};
 const kd=e=>{if(e.key=='ArrowLeft')dir=-1;if(e.key=='ArrowRight')dir=1},ku=()=>dir=0;addEventListener('keydown',kd);addEventListener('keyup',ku);
 cv.onclick=()=>{if(over){sc=0;lv=3;over=false;items=[]}};
 function lp(now){raf=requestAnimationFrame(lp);const dt=Math.min((now-last)/1000,.05);last=now;g.clearRect(0,0,640,400);
  if(!over){px=Math.max(45,Math.min(595,px+dir*380*dt));tt+=dt;if(tt>10){tt=0;tg=(tg+1+Math.floor(Math.random()*7))%8;blip(600,.1)}sp+=dt;if(sp>Math.max(.35,.8-sc*.01)){sp=0;items.push({x:rnd(30,610),y:-10,t:Math.random()<.4?tg:Math.floor(rnd(0,8)),v:rnd(110,170)+sc*2})}
   items.forEach(o=>{o.y+=o.v*dt;if(o.y>360&&o.y<385&&Math.abs(o.x-px)<48&&!o.d){o.d=1;if(o.t==tg){sc+=10;blip(950)}else{lv--;blip(160);if(lv<=0)over=true}}});items=items.filter(o=>o.y<420&&!o.d)}
  g.fillStyle='#ffd27a44';g.fillRect(0,0,640,16);items.forEach(o=>{g.fillStyle=T3[o.t][1];g.shadowColor=T3[o.t][1];g.shadowBlur=14;g.beginPath();g.arc(o.x,o.y,10,0,7);g.fill()});g.shadowBlur=0;
  g.fillStyle='#2ac9b5';g.beginPath();g.roundRect(px-48,370,96,16,8);g.fill();g.fillStyle='#ff6bd6';for(let i=-2;i<=2;i++){g.beginPath();g.arc(px+i*20,370,5,0,7);g.fill()}
  g.fillStyle=T3[tg][1];g.font='bold 18px system-ui';g.fillText('Catch: '+T3[tg][0],220,44);if(over){g.fillStyle='#fff';g.fillText('Game over. Click to restart',200,200)}
  $('s2').textContent='Score: '+sc;$('l2').textContent='Lives: '+'♥'.repeat(Math.max(lv,0))}
 raf=requestAnimationFrame(lp);stop=()=>{cancelAnimationFrame(raf);removeEventListener('keydown',kd);removeEventListener('keyup',ku)}}

/* Game 4: Memory Match (hippocampus training) */
function mem(){const pr=[['Frontal','Plans'],['Parietal','Senses'],['Occipital','Sees'],['Temporal','Hears'],['Hippocampus','Memory'],['Amygdala','Fear'],['Myelin','100 m/s'],['Synapse','20 nm']];
 const cs=shuf(pr.flatMap((p,i)=>[{k:i,s:p[0]},{k:i,s:p[1]}])),A=$('ga');let sel=[],mv=0,done=0,lock=false;
 A.innerHTML=`<div class="hud"><span>Train your hippocampus: match each part with its job</span><span id="mv">Moves: 0</span></div><div class="grid">`+cs.map((c,i)=>`<button class="card" data-i="${i}">?</button>`).join('')+`</div>`;
 A.querySelector('.grid').onclick=e=>{const b=e.target.closest('.card');if(!b||lock||b.classList.contains('m')||sel.includes(b))return;b.textContent=cs[b.dataset.i].s;sel.push(b);blip(500,.08,.1);if(sel.length==2){mv++;$('mv').textContent='Moves: '+mv;const[a,c]=sel;if(cs[a.dataset.i].k==cs[c.dataset.i].k){a.classList.add('m');c.classList.add('m');sel=[];blip(950);if(++done==8)A.insertAdjacentHTML('beforeend',`<h3 style="margin-top:14px">Memory complete in ${mv} moves!</h3>`)}else{lock=true;setTimeout(()=>{sel.forEach(x=>x.textContent='?');sel=[];lock=false},800)}}}}
</script></body></html>
